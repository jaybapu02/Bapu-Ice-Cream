services:
  - type: web
    name: bapu-ice-cream
    runtime: python
    repo: https://github.com/yourusername/bapu-ice-cream
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn Hello.wsgi:application --workers 2 --threads 4 --timeout 60 --access-logfile - --log-level info
    healthCheckPath: /ping/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://*.up.railway.app
      - key: DATABASE_URL
        fromDatabase:
          name: bapu-ice-cream-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@bapuicecream.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: bapu-ice-cream-db
    plan: free
    region: oregon
    databaseName: bapu_ice_cream
    ipAllowList: []
